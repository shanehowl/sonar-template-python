[project]
name = "sonar-template-python"
version = "0.1.0"
description = "A deliberately tiny Python app for practising local SonarQube scans"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
sonar-template-python = "sonar_template_python.__main__:main"

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-cov>=7.1",
  "ruff>=0.17",
  "pysonar>=1.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sonar_template_python"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sonar_template_python --cov-report=term-missing --cov-report=xml:coverage.xml"

[tool.coverage.run]
relative_files = true # repo-relative paths in coverage.xml, so SonarQube can match them
source = ["src"]

[tool.coverage.report]
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# Read by pysonar (`uv run pysonar`). The host URL and token come from
# SONAR_HOST_URL / SONAR_TOKEN, so nothing secret lives in the repo.
[tool.sonar]
projectKey = "sonar-template-python"
projectName = "sonar-template-python"
sources = "src"
tests = "tests"
python.version = "3.12, 3.13"
python.coverage.reportPaths = "coverage.xml"
sourceEncoding = "UTF-8"
# Exit non-zero when the quality gate fails, same as the React pipeline.
qualitygate.wait = true
qualitygate.timeout = 300
